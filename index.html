<!DOCTYPE html>
<html lang="en">
	<head>
		<title>ADarkHero.de - The best personal homepage in 2026</title>
	
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="stylesheet" href="css/main.css">
	</head>

	<body id="body">
		<video autoplay muted loop id="bg-video">
			<source src="#" type="video/mp4">
		</video>

		<div id="wrapper">
			<div id="settings">
				<a href="javascript:void(0)" onclick="javascript:closeSpeechbubble()">
					<div class="speech-bubble hidden" id="speech-bubble"></div>
				</a>

				<a href="javascript:void(0)"  onClick="javascript:setPage('settings')">
					<img src="img/settings-mops.png" alt="settings-mops" id="settings-mops" class="no-sepia-filter" />
				</a>
			</div>
		
			<div id="left-container">
				
			</div>

			<div id="main-container">				
				<nav class="overflow-clip main-nav">
					<ul>
						<li class="nav-button header-bg bg-root" id="root"><a href="?page=root">/root</a></li>
						<li class="nav-button header-bg bg-projects" id="projects"><a href="?page=projects">/projects</a></li>
						<li class="nav-button header-bg bg-likes" id="likes"><a href="?page=likes">/likes</a></li>
						<li class="nav-button header-bg bg-lifegoals" id="lifegoals"><a href="?page=lifegoals">/lifegoals</a></li>
						<li class="nav-button header-bg bg-fun" id="fun-corner"><a href="?page=fun-corner">/fun-corner</a></li>
						<li class="nav-button header-bg bg-external" id="links"><a href="?page=links">/links</a></li>
						<li class="nav-button header-bg bg-book"><a href="?page=guestbook">/gbook</a></li>
						<li class="nav-button header-bg bg-blog"><a href="?page=blog">/blog</a></li>
					</ul>
				</nav>
				
				
				<header id="page-header" class="overflow-clip">
					<div id="page-name">Page name</div>
					<div id="header-buttons" class="horizontal-list">
						<nav class="no-border-bottom no-round-borders">
							<ul class="last-no-right-borders">
								<li class="nav-button"><a onClick="javascript:history.back()"><img src="img/smileys/arrow-l.gif" class="inline-img no-sepia-filter"/>&nbsp;Back</a></li>
								<li class="nav-button"><a onClick="javascript:scrollToTop()"><img src="img/smileys/up.gif" class="inline-img no-sepia-filter"/>&nbsp;Top</a></li>
								<li class="nav-button"><a onClick="javascript:resizePage()"><img src="img/smileys/waffle.gif" class="inline-img no-sepia-filter"/>&nbsp;Resize</a></li>
								<li class="nav-button"><a onClick="javascript:history.forward()" id="btn-forward"><img src="img/smileys/arrow.gif" class="inline-img"/>&nbsp;Forward</a></li>
							</ul>
						</nav>
					</div>
				</header>
				
				<div id="main-content" class="scrollbar fade-in">
					<noscript>
						<div class="error-message">
							This website needs basic javascript to run correctly. Please enable it. I won't track you and I won't steal your cookies. I also won't kill you. Pinky promise. uwu
						</div>
					</noscript>
				</div>

				<footer class="mobile-only center-me">
					<ul>
						<li><img src="img/smileys/up.gif" class="inline-img"/>  <a href="#">Scroll back to top</a></li>
					</ul>
				</footer>

				<footer>
					<ul>
						<li><img src="img/smileys/star.gif" class="no-sepia-filter inline-img"/> <a href="?page=imprint">ADarkHero</a> {current-year}</li>
						<li><a href="?page=imprint">Imprint / Contact</a></li>
						<li><a href="?page=credits">Credits</a></li>
						<li>Handmade with <img src="img/smileys/heart.gif" class="no-sepia-filter inline-img"/> (and pure html/css/js) without <img src="img/smileys/cookie.gif" class="no-sepia-filter inline-img"/> and tracking</li>
					</ul>
				</footer>
			</div>

			<div id="right-container">
				
			</div>
		</div>
		
		<dialog id="lightbox"></dialog>

		<script src="js/main.js"></script>
		<script src="js/navigation.js"></script>
		<script src="js/settings.js"></script>
		<script src="js/lightbox.js"></script>
		<script src="js/mouse.js"></script>
		<script src="js/pokeneko.js"></script>

		<script>
			readSettings();
			checkBtnForward();
			changeRootIcon();
			
			var page = findGetParameter("page") || "root"; <!-- root is default page -->
			setPage(page);
		</script>

	</body>

</html>
