<!DOCTYPE html>
<html lang="en">
	<head>
		<title>ADarkHero.de - The best personal homepage in 2026</title>
	
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="stylesheet" href="css/main.css">
	</head>

	<body id="body">
		
		<div id="wrapper">
			<div id="settings">
				<a href="#" onClick="javascript:setPage('settings')">
					<img src="img/settings-mops.png" onmouseover="this.src='img/settings-mops-hover.png';" onmouseout="this.src='img/settings-mops.png';" alt="settings-mops" id="settings-mops" />
				</a>
			</div>
		
			<div id="left-container">
				
			</div>

			<div id="main-container">
				<nav class="fade-in">
					<ul>
						<li>
							<a href="index.html">
								<img src="img/nav/root.png" alt="root - main page" />
							</a>
						</li>
						<li>
							<a href="?page=stuff">
								<img src="img/nav/stuff.png" alt="stuff i did in the past" />
							</a>
						</li>
						<li>
							<a href="?page=likes">
								<img src="img/nav/like.png" alt="i like heartemoji" />
							</a>
						</li>
						<li>
							<a href="https://www.heldendenken.de" target="_blank">
								<img src="img/nav/blog.png" alt="external link to blog" />
							</a>
						</li>
						<li>
							<a href="https://cv.adarkhero.de" target="_blank">
								<img src="img/nav/cv.png" alt="external link to blog" />
							</a>
						</li>
						<li>
							<a href="https://github.com/ADarkHero" target="_blank">
								<img src="img/nav/code.png" alt="external link to github - coding" />
							</a>
						</li>
					</ul>
				</nav>
				
				<header id="page-header" class="fade-in">
					<div id="page-name">Page name</div>
					<div id="header-buttons">
						<button class="close-page" onClick="javascript:setPage('home')"> _ </button>
						<button class="resize-page" onClick="javascript:resizePage()">[ ]</button>
						<button class="close-page" onClick="javascript:closePage()"> x </button>
					</div>
				</header>
				
				<div id="main-content" class="fade-in">
					<noscript>
						<div class="error-message">
							This website needs basic javascript to run correctly. Please enable it. I won't track you and I won't steal your cookies. I also won't kill you. Pinky promise. uwu
						</div>
					</noscript>
				</div>
				
				<footer>
					<ul>
						<li>⭐ <a href="?page=imprint">ADarkHero</a> {current-year}</li>
						<li><a href="?page=imprint">Imprint / Contact</a></li>
						<li><a href="?page=credits">Credits</a></li>
						<li>Handmade with ♥️ (and pure html/css/js) without 🍪 and tracking</li>
					</ul>
				</footer>
			</div>

			<div id="right-container">
				
			</div>
		</div>
		
		<dialog id="lightbox"></dialog>
		

		<script src="js/main.js"></script>
		<script src="js/navigation.js"></script>
		<script src="js/settings.js"></script>
		<script src="js/lightbox.js"></script>

		<script>
			readSettings();
			
			var page = findGetParameter("page") || "home"; <!-- home is default page -->
			setPage(page);
		</script>
	</body>

</html>
