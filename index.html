<!DOCTYPE html>
<html lang="en">
	<head>
		<title>ADarkHero.de - The best personal homepage in 2026</title>
	
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="stylesheet" href="css/main.css">
	</head>

	<body id="body">
		
		<div id="wrapper">
			<div id="settings">
				<a href="#" onClick="javascript:setPage('settings')">
					<img src="img/settings-mops.png" onmouseover="this.src='img/settings-mops-hover.png';" onmouseout="this.src='img/settings-mops.png';" alt="settings-mops" id="settings-mops" />
				</a>
			</div>
		
			<div id="left-container">
				
			</div>

			<div id="main-container">				
				<nav>
					<ul>
						<li><a href="?page=root" class="nav-button header-bg bg-root">/root</a></li>
						<li><a href="?page=projects" class="nav-button header-bg bg-projects">/projects</a></li>
						<li><a href="?page=likes" class="nav-button header-bg bg-likes">/likes</a></li>
						<li><a href="https://www.heldendenken.de" target="_blank" class="nav-button header-bg bg-blog">/blog</a></li>
						<li><a href="https://github.com/ADarkHero" target="_blank" class="nav-button header-bg bg-coding">/code</a></li>
						<li><a href="https://cv.adarkhero.de" target="_blank" class="nav-button header-bg bg-cv">/cv</a></li>
					</ul>
				</nav>
				
				
				<header id="page-header" class="fade-in">
					<div id="page-name">Page name</div>
					<div id="header-buttons">
						<button class="close-page" onClick="javascript:setPage('root')"> _ </button>
						<button class="resize-page" onClick="javascript:resizePage()">[ ]</button>
						<button class="close-page" onClick="javascript:closePage()"> x </button>
					</div>
				</header>
				
				<div id="main-content" class="fade-in">
					<noscript>
						<div class="error-message">
							This website needs basic javascript to run correctly. Please enable it. I won't track you and I won't steal your cookies. I also won't kill you. Pinky promise. uwu
						</div>
					</noscript>
				</div>
				
				<footer>
					<ul>
						<li>⭐ <a href="?page=imprint">ADarkHero</a> {current-year}</li>
						<li><a href="?page=imprint">Imprint / Contact</a></li>
						<li><a href="?page=credits">Credits</a></li>
						<li>Handmade with ♥️ (and pure html/css/js) without 🍪 and tracking</li>
					</ul>
				</footer>
			</div>

			<div id="right-container">
				
			</div>
		</div>
		
		<dialog id="lightbox"></dialog>
		

		<script src="js/main.js"></script>
		<script src="js/navigation.js"></script>
		<script src="js/settings.js"></script>
		<script src="js/lightbox.js"></script>

		<script>
			readSettings();
			
			var page = findGetParameter("page") || "root"; <!-- root is default page -->
			setPage(page);
		</script>
	</body>

</html>
